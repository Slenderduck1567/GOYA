<!doctype html>
<!-- Template for the 1200×630 link preview image (public/assets/share-card.jpg).
     Uses the site's own fonts, colours, hero photo and logo. Render it with
     `node scripts/share-card/render.mjs` (see that file). -->
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Archivo'; font-weight: 900; src: url('../../node_modules/@fontsource/archivo/files/archivo-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Hanken Grotesk'; font-weight: 400; src: url('../../node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 400; src: url('../../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0e0f12; }
  .card { position: relative; width: 1200px; height: 630px; color: #fff; isolation: isolate; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; z-index: -2; }
  /* Same shading as the homepage hero, plus a soft top edge for the logo. */
  .shade { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, #090f1b99 0%, transparent 30%),
                linear-gradient(90deg, #090f1b8c, transparent 85%),
                linear-gradient(0deg, #090f1bbf, transparent 75%); }
  .logo { position: absolute; top: 48px; left: 64px; width: 178px; }
  .caption { position: absolute; top: 72px; right: 64px; font: 400 14px/1 'Space Mono', monospace; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
  .copy { position: absolute; left: 64px; right: 64px; bottom: 56px; }
  .eyebrow { display: block; font: 400 15px/1.5 'Space Mono', monospace; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 18px; }
  h1 { font: 900 128px/.92 'Archivo', sans-serif; letter-spacing: -.065em; text-transform: uppercase; }
  h1 .period { color: #96c7fa; }
  .tagline { display: flex; align-items: center; gap: 18px; margin-top: 30px; font: 400 24px/1.3 'Hanken Grotesk', sans-serif; }
  .tagline img { width: 40px; filter: invert(1); opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../../public/assets/photos/goya-crowd.jpg" alt="" />
    <div class="shade"></div>
    <img class="logo" src="../../public/assets/logo-goya-white.png" alt="GOYA" />
    <span class="caption">Brisbane · Est. 1967</span>
    <div class="copy">
      <span class="eyebrow">Greek roots. Brisbane home.</span>
      <h1>Find your<br />parea<span class="period">.</span></h1>
      <p class="tagline"><img src="../../public/assets/meander.svg" alt="" />Faith. Culture. Friendship.</p>
    </div>
  </div>
</body>
</html>
